<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juice Shop Clone, Login</title>
  <link rel="stylesheet" href="../public/styles.css" />
</head>
<body>
  <main class="card">
    <h1>Login</h1>
    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="admin@juice-sh.op' OR '1'='1" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" value="anything123" />

      <button type="submit">Log in</button>
    </form>
    <p id="status" class="error" role="alert">Invalid email or password.</p>
  </main>
</body>
</html>
